<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-label="Prawns Farm logo">
  <defs>
    <linearGradient id="pfBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#16a34a"/>
      <stop offset="1" stop-color="#0e7a37"/>
    </linearGradient>
    <linearGradient id="pfPrawn" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffb37a"/>
      <stop offset="0.55" stop-color="#ff7a59"/>
      <stop offset="1" stop-color="#ef4444"/>
    </linearGradient>
  </defs>

  <!-- Emblem background -->
  <rect x="4" y="4" width="120" height="120" rx="30" fill="url(#pfBg)"/>
  <circle cx="64" cy="64" r="52" fill="rgba(255,255,255,0.08)"/>

  <!-- Water ripples -->
  <path d="M26 96 q12 -9 24 0 t24 0 t24 0" fill="none" stroke="rgba(255,255,255,0.45)" stroke-width="3.2" stroke-linecap="round"/>
  <path d="M30 106 q12 -8 24 0 t24 0" fill="none" stroke="rgba(255,255,255,0.28)" stroke-width="3" stroke-linecap="round"/>

  <!-- Stylised prawn -->
  <g transform="translate(64 60) rotate(18)">
    <!-- curled body -->
    <path d="M-26 -8
             C -34 10, -18 28, 6 24
             C 26 21, 34 4, 28 -10
             C 24 -20, 12 -24, 2 -20
             C -6 -17, -8 -10, -2 -6
             C 4 -2, 12 -5, 12 -12"
          fill="none" stroke="url(#pfPrawn)" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- tail fan -->
    <path d="M-26 -8 l -12 -8 m 12 8 l -14 0 m 14 0 l -10 10"
          fill="none" stroke="url(#pfPrawn)" stroke-width="5" stroke-linecap="round"/>
    <!-- antennae -->
    <path d="M26 -12 q 16 -4 24 -16 M26 -6 q 18 2 28 -4"
          fill="none" stroke="#fde68a" stroke-width="3" stroke-linecap="round"/>
    <!-- eye -->
    <circle cx="22" cy="-13" r="3.4" fill="#0f172a"/>
  </g>
</svg>
